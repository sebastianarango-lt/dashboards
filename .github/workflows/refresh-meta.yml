name: Refresh Meta Ads Data Only

on:
  workflow_dispatch:        # Manual trigger from GitHub UI — fast path when you just need Meta Ads re-fetched

permissions:
  contents: write

jobs:
  refresh-meta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch Meta Ads (Santi - account view)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python fetch_meta_ads.py

      - name: Commit updated data file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta-ads-data.json
          git diff --cached --quiet || git commit -m "chore: refresh Meta Ads data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
