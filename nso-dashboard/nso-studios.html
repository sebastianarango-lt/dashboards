<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SWEAT440 — NSO Studios Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="icon" href="../favicon.jpg"/>
<link rel="stylesheet" href="../shared/style.css"/>
<style>
/* Summary-specific styles */
.summary-studio-select{margin-bottom:20px}
.summary-studio-select select{font-family:'Oswald',sans-serif;font-size:14px;padding:8px 16px;border-radius:8px;font-style:italic;text-transform:uppercase;letter-spacing:.5px}
.timeline-bar{position:relative;height:28px;background:#f0f6fa;border-radius:14px;overflow:visible;margin-bottom:8px}
.timeline-fill{height:100%;border-radius:14px;background:linear-gradient(90deg,var(--c-leads),var(--c-ft));transition:width .6s ease;position:relative;min-width:8px}
.timeline-marker{position:absolute;top:-6px;width:2px;height:40px;background:#1a1a2e;opacity:.3}
.timeline-marker-label{position:absolute;top:46px;font-size:10px;color:#5a7a8a;font-weight:600;white-space:nowrap;transform:translateX(-50%)}
.timeline-marker.co{background:#f4a021;opacity:.9;width:2px}
.timeline-marker.co .timeline-marker-label{color:#f4a021;font-weight:700}
.timeline-marker.go .timeline-marker-label{color:#e05a5a;font-weight:700}
.timeline-marker.tier2{background:#27ae60;opacity:.9;width:2px}
.timeline-marker.tier2 .timeline-marker-label{color:#27ae60;font-weight:700}
.timeline-marker.tier3{background:#8e44ad;opacity:.9;width:2px}
.timeline-marker.tier3 .timeline-marker-label{color:#8e44ad;font-weight:700}
.timeline-current{position:absolute;top:-2px;right:-6px;width:12px;height:12px;border-radius:50%;background:var(--c-ft);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:2}
.timeline-weeks{display:flex;justify-content:space-between;font-size:9px;color:#8aaabb;margin-top:4px}
.summary-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.summary-card{padding:18px 20px}
.summary-card-section{font-family:'Oswald',sans-serif;font-style:italic;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;color:#5a7a8a;margin-bottom:14px}
.sk-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.sk-label{font-size:11px;color:#5a7a8a;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sk-vals{text-align:right}
.sk-actual{font-size:22px;font-weight:700;color:#1a1a2e;line-height:1}
.sk-goal{font-size:11px;color:#8aaabb;margin-top:2px}
.sk-check{color:#0a8a4a;font-weight:700;margin-left:4px}
.sk-miss{color:#d32f2f;font-weight:700;margin-left:4px}
.sk-progress{height:14px;background:#f0f6fa;border-radius:7px;margin-top:5px;overflow:visible;position:relative;margin-bottom:16px}
.sk-progress-fill{height:100%;border-radius:7px;transition:width .6s ease}
.open-countdown{display:flex;flex-direction:column;align-items:center;justify-content:center}
.open-days{font-family:'Oswald',sans-serif;font-size:48px;font-weight:700;color:var(--c-leads);line-height:1}
.open-label{font-family:'Oswald',sans-serif;font-style:italic;font-size:14px;font-weight:600;text-transform:uppercase;color:#e05a5a;letter-spacing:1px;margin-bottom:4px}
.open-date{font-size:11px;color:#5a7a8a}
@media(max-width:768px){.summary-kpis{grid-template-columns:1fr}}
.sc-table td:first-child,.sc-table th:first-child{position:sticky;left:0;background:#fff;z-index:1;border-right:1.5px solid #dde8ef}
.sc-table thead th:first-child{background:#f4f9fd}
.sc-cell-good{background:#e8faf0!important;color:#0a8a4a}
.sc-cell-warn{background:#fff8e1!important;color:#b8860b}
.sc-cell-bad{background:#ffeaea!important;color:#c0392b}
.sc-cell-cur{background:#e8f4fd!important}
/* Social posts table (Instagram / Facebook) */
.soc-table{width:100%;border-collapse:collapse;table-layout:fixed}
.soc-row{display:grid;gap:10px;padding:9px 12px;border-bottom:1px solid #edf3f7;align-items:center}
.soc-row:last-child{border-bottom:none}
.soc-row:not(.soc-th):hover{background:#f9fbfd}
.soc-row.soc-th{background:#f4f9fd;border-bottom:2px solid #dde8ef}
.soc-row.soc-ig{grid-template-columns:70px 68px 1fr 62px 50px 72px 58px 60px 58px 52px}
.soc-row.soc-fb{grid-template-columns:70px 68px 1fr 65px 65px}
.soc-cell{font-size:12.5px;color:#5a7a8a;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soc-cell:first-child,.soc-cell.soc-left{text-align:left;color:#1a4d6e}
.soc-row.soc-th .soc-cell:nth-child(3){text-align:left}
.soc-th .soc-cell{font-size:10px;font-weight:700;color:#8aaabb;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;user-select:none;font-family:'Oswald',sans-serif}
.soc-th .soc-cell:hover,.soc-th .soc-cell.sorted{color:var(--c-leads)}
.soc-cell.sc{color:var(--c-leads);font-weight:600}
.soc-thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;border:1px solid #dde8ef;display:block}
.soc-thumb-ph{width:60px;height:60px;border-radius:8px;background:#f0f6fa;border:1px solid #dde8ef;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#8aaabb}
.soc-caption{font-size:12px;color:#1a4d6e;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4;text-align:left}
.soc-caption a{color:#1a4d6e;text-decoration:none}.soc-caption a:hover{color:var(--c-leads);text-decoration:underline}
.soc-date{font-size:11px;color:#8aaabb;font-weight:600}
.soc-studio-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.04em;margin-top:3px}
@media(max-width:640px){.soc-row.soc-ig{grid-template-columns:56px 56px 1fr 48px 48px}.soc-row.soc-ig .soc-cell:nth-child(n+6){display:none}.soc-row.soc-ig.soc-th .soc-cell:nth-child(n+6){display:none}.soc-row.soc-ig.soc-th .soc-cell:nth-child(n+6){display:none}.soc-row.soc-fb{grid-template-columns:56px 56px 1fr}.soc-row.soc-fb .soc-cell:nth-child(n+4){display:none}}
#leadsRingLeg,#memRingLeg{display:flex!important;flex-direction:column;gap:10px;font-size:13px;line-height:1.4;width:auto}
#leadsRingLeg .ring-legend-item,#memRingLeg .ring-legend-item{display:flex!important;align-items:center;gap:0;width:auto}
#leadsRingLeg .ring-legend-dot,#memRingLeg .ring-legend-dot{width:12px!important;height:12px!important;border-radius:3px;flex-shrink:0;margin-right:12px}
#leadsRingLeg .ring-legend-label,#memRingLeg .ring-legend-label{white-space:nowrap;color:#1a1a2e;margin-right:16px;flex:0 0 auto}
#leadsRingLeg .ring-legend-vol,#memRingLeg .ring-legend-vol{white-space:nowrap;text-align:right;color:#5a7a8a;margin-right:10px;flex:0 0 auto}
#leadsRingLeg .ring-legend-pct,#memRingLeg .ring-legend-pct{white-space:nowrap;text-align:right;font-weight:700;color:#1a1a2e;flex:0 0 auto}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../users.js"></script>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   NSO STUDIOS DASHBOARD — Self-contained
   ══════════════════════════════════════════════════════════════════════════ */
const NSO=['SWEAT440 Herriman','SWEAT440 Naples - Mercato','SWEAT440 Reston','SWEAT440 Orlando - Dr Phillips','SWEAT440 Aventura','SWEAT440 North Miami','SWEAT440 Dallas - Uptown','SWEAT440 Old Bridge','SWEAT440 Dunwoody','SWEAT440 Middletown'];
const EXCL_SRC=['ClassPass / Platforms','N/A'];

let RAW=null,SC=null,GRAN='daily',trendChart=null,NSO_SALES=null,NSO_SALES_ROWS=[],GBP_RAW=null,AD_META={};const _ch={};
let CUR_USER=null;const isAdminUser=()=>CUR_USER&&CUR_USER.role==='admin';
let _sumView='cum',_sumStudio=null,_scStudio=null,_dataThruLabel='',_sumD7End=null;
const TODAY=new Date(),fom=new Date(TODAY.getFullYear(),TODAY.getMonth(),1),lpm=new Date(fom.getTime()-864e5),fpm=new Date(lpm.getFullYear(),lpm.getMonth(),1);
function lds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
document.getElementById('fFrom').value=lds(fpm);document.getElementById('fTo').value=lds(lpm);

function toggleNav(){document.getElementById('navTabs').classList.toggle('open')}
function toggleControls(){const e=document.getElementById('ctrlInner');e.classList.toggle('open');document.getElementById('ctrlToggle').textContent=e.classList.contains('open')?'Filters ▴':'Filters ▾'}
function switchTab(id,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  if(btn&&btn.closest('.nav-submenu')){
    document.querySelectorAll('.nav-submenu').forEach(g=>g.classList.remove('open'));
    document.querySelectorAll('.nav-group-label').forEach(b=>b.classList.remove('group-open'));
    btn.closest('.nav-submenu').classList.add('open');
    btn.closest('.nav-group').querySelector('.nav-group-label').classList.add('group-open');
  }
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  document.getElementById('navTabs').classList.remove('open');
  document.querySelector('.controls-bar').style.display=(id==='summary'||id==='scorecard')?'none':'';
  if(id==='summary')renderSummary();
  else if(id==='scorecard')renderScorecard();
  else if(id==='gbp')renderGBP();
  else if(id==='ga4')renderGA4();
  else if(id==='meta')renderMeta();
  else if(id==='google')renderGoogle();
  else if(id==='instagram')renderInstagram();
  else if(id==='funnel'){renderFunnel();applyFilters();}
  else applyFilters();
}
function toggleNavGroup(groupId,btn){
  const sub=document.getElementById(groupId);
  const isOpen=sub.classList.contains('open');
  document.querySelectorAll('.nav-submenu').forEach(s=>s.classList.remove('open'));
  document.querySelectorAll('.nav-group-label').forEach(b=>b.classList.remove('group-open'));
  if(!isOpen){sub.classList.add('open');btn.classList.add('group-open');}
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.nav-group')){
    document.querySelectorAll('.nav-submenu').forEach(s=>s.classList.remove('open'));
    document.querySelectorAll('.nav-group-label').forEach(b=>b.classList.remove('group-open'));
  }
});

/* Multi-select */
function _toggleDD(id){document.querySelectorAll('.ms-menu').forEach(m=>{if(m.id!==id+'Menu')m.classList.remove('open')});document.getElementById(id+'Menu').classList.toggle('open')}
document.addEventListener('click',e=>{if(!e.target.closest('.multi-select'))document.querySelectorAll('.ms-menu').forEach(m=>m.classList.remove('open'))});
function _buildMS(mid,lid,items,excl){const m=document.getElementById(mid);m.innerHTML='';const ad=document.createElement('div');ad.className='ms-item ms-select-all';ad.innerHTML=`<input type=checkbox id=${mid}_all> <label for=${mid}_all style=cursor:pointer>Select all</label>`;m.appendChild(ad);const sep=document.createElement('div');sep.className='ms-divider';m.appendChild(sep);items.forEach(it=>{const d=document.createElement('div');d.className='ms-item';const ch=!excl.includes(it);const si=`ms_${mid}_${it.replace(/[^a-z0-9]/gi,'_')}`;d.innerHTML=`<input type=checkbox id="${si}" value="${it}" ${ch?'checked':''}> <label for="${si}" style=cursor:pointer>${it}</label>`;d.querySelector('input').addEventListener('change',()=>{_syncA(mid);_updL(mid,lid,items);applyFilters()});m.appendChild(d)});const ac=document.getElementById(mid+'_all');_syncA(mid);ac.addEventListener('change',()=>{m.querySelectorAll('input[value]').forEach(c=>c.checked=ac.checked);_updL(mid,lid,items);applyFilters()});_updL(mid,lid,items)}
function _syncA(mid){const m=document.getElementById(mid);const all=[...m.querySelectorAll('input[value]')];const ac=document.getElementById(mid+'_all');const n=all.filter(c=>c.checked).length;ac.checked=n===all.length;ac.indeterminate=n>0&&n<all.length}
function _updL(mid,lid,items){const ch=[...document.getElementById(mid).querySelectorAll('input[value]:checked')].map(c=>c.value);const l=document.getElementById(lid);if(ch.length===0)l.textContent='None';else if(ch.length===items.length)l.textContent='All';else if(ch.length<=2)l.textContent=ch.map(s=>s.replace('SWEAT440 ','')).join(', ');else l.textContent=ch.length+' selected'}
function _getSel(mid){return[...document.getElementById(mid).querySelectorAll('input[value]:checked')].map(c=>c.value)}

/* Data helpers */
function grd(r){return new Date((r.date||r.month)+'T00:00:00Z')}
function fR(arr,f,t,st,sr){return arr.filter(r=>{const d=grd(r);if(f&&d<f)return false;if(t&&d>t)return false;if(st&&!st.includes(r.studio))return false;if(sr&&!sr.includes(r.source))return false;return true})}
function sR(rows){return rows.reduce((a,r)=>{a.leads+=r.signups||0;a.ft+=r.first_visits||0;a.mem+=r.first_sales||0;return a},{leads:0,ft:0,mem:0})}
function cW(f,t){const ms=t-f;const pp2=new Date(f.getTime()-864e5);const pp1=new Date(pp2.getTime()-ms);const py1=new Date(f);py1.setFullYear(py1.getFullYear()-1);const py2=new Date(t);py2.setFullYear(py2.getFullYear()-1);return{ppFrom:pp1,ppTo:pp2,pyFrom:py1,pyTo:py2}}
function cD(c,p){return p?(c-p)/p*100:null}
function fmD(d){return d.toLocaleString('en-US',{month:'short',year:'numeric'})}
function fmDay(iso){return new Date(iso+'T00:00:00Z').toLocaleString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}
function fmMo(iso){return new Date(iso+'T00:00:00Z').toLocaleString('en-US',{month:'short',year:'2-digit',timeZone:'UTC'})}
function _wkLabel(dateStr){
  if(!SC||!SC.studios)return'';
  const sel=_getSel('studioMenu');
  const studios=sel.length?SC.studios.filter(s=>sel.includes(s.full_name)):SC.studios;
  // Prefer a single-selected studio; fall back to the funnel/summary focused studio
  const studio=studios.length===1?studios[0]:(_sumStudio||null);
  if(!studio)return'';
  for(const wk of(studio.weeks||[])){
    if(wk.date_start&&wk.date_end&&dateStr>=wk.date_start&&dateStr<=wk.date_end)
      return wk.week.replace('Week ','W').replace('WEEK ','W');
  }
  return'';
}
function toTS(d,m){const map={};if(GRAN==='daily'){d.forEach(r=>{if(!map[r.date])map[r.date]={key:r.date,label:fmDay(r.date),signups:0,first_visits:0,first_sales:0};map[r.date].signups+=r.signups||0;map[r.date].first_visits+=r.first_visits||0;map[r.date].first_sales+=r.first_sales||0})}else if(GRAN==='weekly'){[...d,...m].forEach(r=>{const dt=new Date((r.date||r.month)+'T00:00:00Z');const dy=dt.getUTCDay()||7;const ws=new Date(dt);ws.setUTCDate(dt.getUTCDate()-dy+1);const k=ws.toISOString().slice(0,10);if(!map[k])map[k]={key:k,label:fmDay(k),signups:0,first_visits:0,first_sales:0};map[k].signups+=r.signups||0;map[k].first_visits+=r.first_visits||0;map[k].first_sales+=r.first_sales||0})}else{[...d,...m].forEach(r=>{const k=(r.date||r.month).slice(0,7)+'-01';if(!map[k])map[k]={key:k,label:fmMo(k),signups:0,first_visits:0,first_sales:0};map[k].signups+=r.signups||0;map[k].first_visits+=r.first_visits||0;map[k].first_sales+=r.first_sales||0})}return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key))}
function toSrcTS(d,m){const map={};d.forEach(r=>{const mk=r.date+'|'+r.source;if(!map[mk])map[mk]={key:r.date,source:r.source,signups:0,first_visits:0,first_sales:0};map[mk].signups+=r.signups||0;map[mk].first_visits+=r.first_visits||0;map[mk].first_sales+=r.first_sales||0});return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key))}
function toSrcTSGran(d,m){const map={};const rows=GRAN==='monthly'?[...d,...m]:d;rows.forEach(r=>{const raw=r.date||r.month;let k;if(GRAN==='weekly'){const dt=new Date(raw+'T00:00:00Z');const dy=dt.getUTCDay()||7;const ws=new Date(dt);ws.setUTCDate(dt.getUTCDate()-dy+1);k=ws.toISOString().slice(0,10)}else if(GRAN==='monthly'){k=raw.slice(0,7)+'-01'}else{k=r.date}const mk=k+'|'+r.source;if(!map[mk])map[mk]={key:k,source:r.source,signups:0,first_visits:0,first_sales:0};map[mk].signups+=r.signups||0;map[mk].first_visits+=r.first_visits||0;map[mk].first_sales+=r.first_sales||0});return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key))}
// Buckets arbitrary daily rows into the current GRAN's period key, matching toTS's key scheme exactly —
// used to build the Funnel Over Time "Sales" line from whichever dataset backs the Total Sales KPI card,
// so the chart's total always equals the card (see applyFilters).
function _periodKey(dateStr){if(GRAN==='daily')return dateStr;if(GRAN==='weekly'){const dt=new Date(dateStr+'T00:00:00Z');const dy=dt.getUTCDay()||7;const ws=new Date(dt);ws.setUTCDate(dt.getUTCDate()-dy+1);return ws.toISOString().slice(0,10)}return dateStr.slice(0,7)+'-01'}
function _bucketByPeriod(rows,valueFn){const map={};rows.forEach(r=>{const raw=r.date||r.month;if(!raw)return;const k=_periodKey(raw);map[k]=(map[k]||0)+valueFn(r)});return map}
function _esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function kpiCard(l,v,pp,py,fmt,info){const dpp=cD(v,pp),dpy=cD(v,py);const ppH=dpp!=null?`<div class="kpi-card-delta ${dpp>=0?'pos':'neg'}">${dpp>=0?'▲':'▼'} ${Math.abs(dpp).toFixed(1)}% prev period</div>`:'';const pyH=dpy!=null?`<div class="kpi-card-delta ${dpy>=0?'pos':'neg'}">${dpy>=0?'▲':'▼'} ${Math.abs(dpy).toFixed(1)}% prev year</div>`:'';const fmtd=fmt?fmt(v):v.toLocaleString('en-US');const infoBtn=info?`<button class="kpi-info-btn" onclick="showKpiInfo(this,event)" data-title="${_esc(info.title||l)}" data-desc="${_esc(info.desc)}" data-date="${_esc(info.date||'')}">i</button>`:'';return`<div class="kpi-card">${infoBtn}<div class="kpi-card-label">${l}</div><div class="kpi-card-val">${fmtd}</div>${ppH}${pyH}</div>`}

function switchSumStudio(code){
  const sc=SC&&SC.studios&&SC.studios.find(s=>s.code===code);
  if(!sc)return;
  _sumStudio=sc;
  renderSummary();
  if(document.getElementById('tab-funnel').classList.contains('active'))renderFunnel();

function renderSummary(){
  if(!SC||!SC.studios||!SC.studios.length)return;

  // Pick studio from _sumStudio state; fall back to first in list
  const studio=_sumStudio||SC.studios[0];
  if(!studio){document.getElementById('summaryContent').innerHTML='';return;}
  if(!_sumStudio)_sumStudio=studio;

  const w=studio.weeks,tgt=studio.targets;
  const totalWeeks=studio.go_week||(w.length-1);
  // paceWeeks: use co_week as the goal denominator so pace/benchmarks target C/O date, not GO
  const paceWeeks=studio.co_week||totalWeeks;

  // Compute current week from today vs week bounds (JS-side, for display accuracy)
  const todayStr=new Date().toISOString().slice(0,10);
  function _liso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  const _d7endDate=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()-2);})();
  const d7end=_liso(_d7endDate);
  const d7ago=_liso(new Date(_d7endDate.getTime()-6*864e5));
  _sumD7End=d7end;
  let cw=0;
  for(const wk of w){
    if(wk.date_start&&wk.date_start<=todayStr)cw=parseInt(String(wk.week).replace(/[^0-9]/g,''))||0;
  }

  const cur=w.find(x=>(parseInt(String(x.week).replace(/[^0-9]/g,''))||0)===cw)||w[cw]||{};
  const prev=w.find(x=>(parseInt(String(x.week).replace(/[^0-9]/g,''))||0)===cw-1)||{};
  const _sumTierLookup={};(studio.tier_rmr_by_week||[]).forEach(r=>{_sumTierLookup[r.week]=r;});
  const _sumCurTier=_sumTierLookup[cw];
  const displayCw=cw;
  const pct=Math.min(100,Math.round(displayCw/totalWeeks*100));

  // Opening date: use studio.opening_date from JSON, fall back to GO week data
  const openDate=studio.opening_date||
    (w[totalWeeks]?w[totalWeeks].date_start||w[totalWeeks].date_end:null)||
    (w[w.length-1]?w[w.length-1].date_end:null);

  // Days to open from actual opening_date vs today (used only for pct/timeline internals)
  let daysToOpen=null;
  if(openDate){
    const msLeft=new Date(openDate+'T00:00:00Z')-new Date(todayStr+'T00:00:00Z');
    daysToOpen=Math.max(0,Math.round(msLeft/864e5));
  }else{
    daysToOpen=(totalWeeks-cw)*7;
  }
  // C/O countdown (shown at top of timeline card — measures to C/O, not GO)
  const _coWkNum=studio.co_week||null;
  const _coWkData=_coWkNum?w.find(x=>(parseInt(String(x.week).replace(/[^0-9]/g,''))||0)===_coWkNum):null;
  const coDateStr=_coWkData?(_coWkData.date_start||_coWkData.date_end||null):null;
  const daysToCO=coDateStr?Math.max(0,Math.round((new Date(coDateStr+'T00:00:00Z')-new Date(todayStr+'T00:00:00Z'))/864e5)):daysToOpen;

  const presPct=tgt.presales_count?Math.min(100,Math.round((cur.presales_count||0)/tgt.presales_count*100)):0;

  let h='';

  const _fmtDate=iso=>iso?new Date(iso+'T00:00:00Z').toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric',timeZone:'UTC'}):'';
  const _fmtDateShort=iso=>iso?new Date(iso+'T00:00:00Z').toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric',timeZone:'UTC'}):'';
  const startDate=w[0]?.date_end||w[1]?.date_start||null;
  const curPct=Math.max(4,Math.min(96,pct));

  // Studio switcher tabs
  h+=`<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">`;
  (SC.studios||[]).forEach(s=>{
    const active=s.code===studio.code;
    h+=`<button onclick="switchSumStudio('${s.code}')" style="font-family:Oswald,sans-serif;font-style:italic;font-size:13px;font-weight:600;text-transform:uppercase;padding:6px 16px;border-radius:4px;border:2px solid ${active?'#00A3E0':'#c0d4df'};background:${active?'#00A3E0':'transparent'};color:${active?'#fff':'#5a7a8a'};cursor:pointer;letter-spacing:.5px">${s.name}</button>`;
  });
  h+=`</div>`;

function skRow(label,actual,goal,color,noCheck,infoKey){
  const numActual=typeof actual==='string'?actual:actual.toLocaleString('en-US');
  const numGoal=goal!=null?(typeof goal==='string'?goal:goal.toLocaleString('en-US')):null;
  const met=!noCheck&&typeof actual==='number'&&typeof goal==='number'&&actual>=goal;
  const miss=!noCheck&&typeof actual==='number'&&typeof goal==='number'&&actual<goal;
  const infoHtml=infoKey&&GLOSSARY[infoKey]?_infoBtnInline(infoKey):'';
  let h=`<div class="sk-row"><div><div class="sk-label">${label}${infoHtml}</div></div><div class="sk-vals"><div class="sk-actual">${numActual}`;
  if(met)h+=`<span class="sk-check">✓</span>`;
  h+=`</div>`;
  if(numGoal!=null)h+=`<div class="sk-goal">Goal: ${numGoal}</div>`;
  h+=`</div></div>`;
  if(typeof actual==='number'&&typeof goal==='number'&&goal>0){
    const ratio=actual/goal;
    if(ratio>1){
      const goalLinePct=Math.round(goal/actual*100);
      const goalFmt=goal.toLocaleString('en-US');
      h+=`<div class="sk-progress">`;
      h+=`<div class="sk-progress-fill" style="width:100%;background:${color}"></div>`;
      h+=`<div style="position:absolute;top:-4px;left:${goalLinePct}%;width:2px;height:22px;background:#f4a021;border-radius:1px;transform:translateX(-50%);z-index:2">`;
      h+=`<div style="position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:8px;color:#f4a021;font-weight:700;white-space:nowrap;margin-top:3px">Goal: ${goalFmt}</div>`;
      h+=`</div>`;
      h+=`</div>`;
    } else {
      const basePct=Math.round(ratio*100);
      h+=`<div class="sk-progress"><div class="sk-progress-fill" style="width:${basePct}%;background:${color}"></div></div>`;
    }
  }
  return h;
}

  const tLeads=_ann===300?860:(_ann===250?715:(studio.targets.total_leads||0));
  const wkLeadPace=paceW?tLeads/paceW:0;
  const wkPresPace=paceW?tPres/paceW:0;
  const w=studio.weeks.filter((_,i)=>i<=Math.max(cw+2,totalW));

function drawSumSourceChart(studio,metric){
  const ctx=document.getElementById('sumSrcCanvas');if(!ctx)return;
  if(_ch.sumSrc){_ch.sumSrc.destroy();_ch.sumSrc=null}
  const _d7baseD=_sumD7End?new Date(_sumD7End+'T12:00:00Z'):(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()-2,12);})();
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date(_d7baseD.getTime()-i*864e5);days.push(`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);}
  const _stripS=s=>(s||'').replace(/^SWEAT440\s+/,'');
  const _snameS=studio.data_name||studio.name;
  let rows,netFn;
  if(metric==='leads'){
    rows=(RAW?.daily_detail||[]).filter(r=>_stripS(r.studio)===_snameS&&days.includes(r.date));
    netFn=r=>r.signups||0;
  }else{
    rows=NSO_SALES_ROWS.filter(r=>_stripS(r.studio)===_snameS&&days.includes(r.date));
    netFn=r=>(r.first_sales||0)-(r.cancellations||0);
  }
  const srcTotals={};
  rows.forEach(r=>{const s=r.source||'Unknown';srcTotals[s]=(srcTotals[s]||0)+netFn(r);});
  // For sales: scale positive sources so ring total = aggregate net (matches the bar)
  let _ringNet=null;
  if(metric!=='leads'){
    _ringNet=Math.max(0,Object.values(srcTotals).reduce((s,v)=>s+v,0));
    const _pos=Object.values(srcTotals).reduce((s,v)=>s+Math.max(0,v),0);
    const _sc=_pos>0?_ringNet/_pos:1;
    Object.keys(srcTotals).forEach(s=>{srcTotals[s]=Math.max(0,Math.round(srcTotals[s]*_sc));});
  }else{
    Object.keys(srcTotals).forEach(s=>{srcTotals[s]=Math.max(0,srcTotals[s]);});
  }
  const sources=Object.keys(srcTotals).filter(s=>srcTotals[s]>0).sort((a,b)=>srcTotals[b]-srcTotals[a]);
  const leg=document.getElementById('sumSrcLegend');
  if(!sources.length){
    if(leg)leg.innerHTML=`<div style="color:#8aaabb;font-size:12px;font-style:italic">No data for the last 7 days</div>`;
    return;
  }
  const values=sources.map(s=>srcTotals[s]);
  const colors=sources.map((s,i)=>srcColor(s,i));
  const total=_ringNet!==null?_ringNet:values.reduce((a,b)=>a+b,0);
  _ch.sumSrc=new Chart(ctx,{
    type:'doughnut',
    data:{labels:sources,datasets:[{data:values,backgroundColor:colors,borderColor:'#fff',borderWidth:2,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>` ${c.label}: ${c.parsed.toLocaleString('en-US')} (${(c.parsed/total*100).toFixed(1)}%)`}}},
      cutout:'62%'}
  });
  if(leg)leg.innerHTML=sources.map((src,i)=>{
    const pct=total?(values[i]/total*100).toFixed(1):0;
    return`<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
      <div style="width:10px;height:10px;border-radius:50%;background:${colors[i]};flex-shrink:0"></div>
      <div style="font-size:11px;color:#5a7a8a;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${src}</div>
      <div style="font-size:11px;font-weight:700;color:#1a1a2e;margin-left:4px">${values[i].toLocaleString('en-US')}</div>
      <div style="font-size:10px;color:#8aaabb;min-width:34px;text-align:right">${pct}%</div>
    </div>`;
  }).join('');
}

function applyFilters(){
  if(!RAW)return;
  const st=_getSel('studioMenu'),sr=_getSel('sourceMenu');
  const fs=document.getElementById('fFrom').value,ts=document.getElementById('fTo').value;
  const from=fs?new Date(fs+'T00:00:00Z'):null,to=ts?new Date(ts+'T23:59:59Z'):new Date();
  const wins=from&&to?cW(from,to):{ppFrom:null,ppTo:null,pyFrom:null,pyTo:null};
  function fa(f,t){return{daily:fR(RAW.daily_detail||[],f,t,st,sr),monthly:fR(RAW.monthly_detail||[],f,t,st,sr),get all(){return[...this.daily,...this.monthly]}}}
  const curr=fa(from,to),pp=wins.ppFrom?fa(wins.ppFrom,wins.ppTo):{daily:[],monthly:[],all:[]},py=wins.pyFrom?fa(wins.pyFrom,wins.pyTo):{daily:[],monthly:[],all:[]};
  const cS=sR(curr.all),pS=sR(pp.all),yS=sR(py.all);
  // NSO sales: use MART_SALES_DETAILS (nso_sales_data.json) — net presales (gross minus cancellations)
  const sCurr=fR(NSO_SALES_ROWS,from,to,st,sr);
  const sPP=wins.ppFrom?fR(NSO_SALES_ROWS,wins.ppFrom,wins.ppTo,st,sr):[];
  const sPY=wins.pyFrom?fR(NSO_SALES_ROWS,wins.pyFrom,wins.pyTo,st,sr):[];
  const netSales=rows=>Math.max(0,rows.reduce((a,r)=>a+(r.first_sales||0)-(r.cancellations||0),0));
  let smC=netSales(sCurr),smP=netSales(sPP),smY=netSales(sPY);
  // Use tier_daily_sales for Total Sales when no source filter — email-deduped, correct total (268).
  // When a source filter is active, keep smC from NSO_SALES_ROWS (has source attribution).
  const selSt=(SC&&SC.studios)?(st&&st.length?SC.studios.filter(s=>st.includes(s.full_name)):SC.studios):[];
  let hasTier=false;
  if(selSt.length&&!(sr&&sr.length)){
    let tierC=0,tierP=0,tierY=0;
    const _rng=(f,t)=>{const fs=f?f.toISOString().slice(0,10):null,ts=t?t.toISOString().slice(0,10):null;return r=>(!fs||r.date>=fs)&&(!ts||r.date<=ts);};
    const _sumTier=rows=>rows.reduce((a,r)=>a+(r.count||0),0);
    selSt.forEach(sel=>{
      const tds=sel.tier_daily_sales;
      if(!tds||!tds.length)return;
      tierC+=Math.max(0,_sumTier(tds.filter(_rng(from,to))));
      if(wins.ppFrom)tierP+=Math.max(0,_sumTier(tds.filter(_rng(wins.ppFrom,wins.ppTo))));
      if(wins.pyFrom)tierY+=Math.max(0,_sumTier(tds.filter(_rng(wins.pyFrom,wins.pyTo))));
      hasTier=true;
    });
    if(hasTier){smC=tierC;if(wins.ppFrom)smP=tierP;if(wins.pyFrom)smY=tierY;}
  }
  // Sales-by-period for the Funnel Over Time chart — mirrors whichever dataset backs
  // the Total Sales KPI above (tier-based when no source filter, else NSO_SALES_ROWS net of
  // cancellations), including the same per-studio/overall clamp, so the chart always sums to smC.
  let salesByPeriod;
  if(hasTier){
    const _fs=from?from.toISOString().slice(0,10):null,_ts=to?to.toISOString().slice(0,10):null;
    const _map={};
    selSt.forEach(sel=>{
      const tds=(sel.tier_daily_sales||[]).filter(r=>(!_fs||r.date>=_fs)&&(!_ts||r.date<=_ts));
      if(!tds.length)return;
      if(tds.reduce((a,r)=>a+(r.count||0),0)<0)return; // matches Math.max(0,...) clamp per studio
      tds.forEach(r=>{const k=_periodKey(r.date);_map[k]=(_map[k]||0)+(r.count||0)});
    });
    salesByPeriod=_map;
  }else{
    salesByPeriod=_bucketByPeriod(sCurr,r=>(r.first_sales||0)-(r.cancellations||0));
    if(Object.values(salesByPeriod).reduce((a,b)=>a+b,0)<0)Object.keys(salesByPeriod).forEach(k=>salesByPeriod[k]=0); // matches Math.max(0,...) clamp
  }
  buildTrend(toTS(curr.daily,curr.monthly),salesByPeriod);
  const fkpi=document.getElementById('funnel-kpis');
  if(fkpi)fkpi.innerHTML=kpiCard('Total Leads',cS.leads,pS.leads,yS.leads,null,GLOSSARY.leads)+kpiCard('Total Sales',smC,smP||null,smY||null,null,GLOSSARY.nso_sale);
  document.getElementById('leads-kpis').innerHTML=kpiCard('Total Leads',cS.leads,pS.leads,yS.leads,null,GLOSSARY.leads);
  const leadsSeries=toSrcTSGran(curr.daily,curr.monthly);
  const activeSrcLeads=(sr||[]).filter(s=>leadsSeries.some(r=>r.source===s&&(r.signups||0)>0));
  buildArea('leadsChart','leads-toggles',leadsSeries,activeSrcLeads,'signups');
  buildRing('leadsRing','leadsRingLeg',curr.all,'signups');
  document.getElementById('mem-kpis').innerHTML=kpiCard('Total Sales',smC,smP||null,smY||null,null,GLOSSARY.nso_sale);
  const salesSeries=toSrcTSGran(sCurr,[]);
  const activeSrcSales=(sr||[]).filter(s=>salesSeries.some(r=>r.source===s&&(r.first_sales||0)>0));
  buildArea('memChart','mem-toggles',salesSeries,activeSrcSales,'first_sales');
  buildRing('memRing','memRingLeg',sCurr,'first_sales');
  if(document.getElementById('tab-meta').classList.contains('active'))renderMeta();
  if(document.getElementById('tab-ga4').classList.contains('active'))renderGA4();
  if(document.getElementById('tab-gbp').classList.contains('active'))renderGBP();

  if(document.getElementById('tab-instagram').classList.contains('active'))renderInstagram();
  if(document.getElementById('tab-scorecard').classList.contains('active'))renderScorecard();
  if(document.getElementById('tab-summary').classList.contains('active'))renderSummary();
}

/* Parse "M/D - M/D" or "Label M/D - M/D" date strings → {start,end} YYYY-MM-DD */
function _parseWkDates(s){
  const m=[...s.matchAll(/(\d{1,2})\/(\d{1,2})/g)];
  if(m.length<2)return null;
  const fmt=(mo,dy)=>`2026-${String(mo).padStart(2,'0')}-${String(dy).padStart(2,'0')}`;
  // Use last two matches so label-embedded dates (e.g. "Move to $129 on 3/3 3/2 - 3/8") don't shift the range
  const s0=m[m.length-2],s1=m[m.length-1];
  return{start:fmt(s0[1],s0[2]),end:fmt(s1[1],s1[2])};
}

/* Aggregate data.json rows for a studio within a date range */
function _wkData(studioFull,dateStart,dateEnd){
  if(!RAW||!dateStart)return null;
  const rows=(RAW.daily_detail||[]).filter(r=>
    r.studio===studioFull && r.date>=dateStart && r.date<=dateEnd);
  if(!rows.length)return null;
  const nl=rows.reduce((a,r)=>a+(r.signups||0),0);
  const np=rows.reduce((a,r)=>a+(r.first_sales||0),0);
  const gl=rows.filter(r=>r.source==='Grassroots').reduce((a,r)=>a+(r.signups||0),0);
  return{nl,np,cr:nl>0?np/nl:null,gl};
}

function scKpi(label,val,target,fmt,targetLabel,auto){
  const fv=val!=null?fmt(val):'—';
  const pct=target&&val!=null?Math.min(100,Math.round(val/target*100)):null;
  const tl=targetLabel||(target!=null?fmt(target):null);
  const bar=pct!=null?`<div style="height:4px;background:#f0f6fa;border-radius:2px;margin-top:8px"><div style="height:100%;width:${pct}%;background:${pct>=100?'#0a8a4a':pct>=70?'#f4a021':'#e05a5a'};border-radius:2px"></div></div>`:'';
  const badge=auto?`<span style="font-size:9px;background:#e8f4fd;color:#0077bb;border-radius:3px;padding:1px 5px;margin-left:4px;font-family:Oswald,sans-serif;letter-spacing:.03em">AUTO</span>`:'';
  return`<div class="kpi-card"><div class="kpi-card-label">${label}${badge}</div><div class="kpi-card-val">${fv}</div>${tl?`<div style="font-size:11px;color:#8aaabb;margin-top:2px">Target: ${tl}</div>`:''} ${bar}</div>`;
}

function drawScCumChart(sc,weeks){
  const ctx=document.getElementById('scCumChart');if(!ctx)return;
  if(_ch.scCum){_ch.scCum.destroy();_ch.scCum=null;}
  const go=sc.go_week||27;
  const allW=Array.from({length:go+1},(_,i)=>i);
  const labels=allW.map(i=>`W${i}`);
  const actual=allW.map(i=>{const w=weeks.find(x=>x.w===i);return(w&&w.pc)?w.pc:null;});

  const t440_go=allW.map((_,i)=>+(440/go*i).toFixed(1));

    {label:'Actual Presales',data:actual,borderColor:'#5b9bd5',borderWidth:2.5,pointRadius:3,pointHoverRadius:6,tension:.3,fill:false,spanGaps:false},

function metaFilter(studio,from,to){
  if(!META_RAW)return[];
  const code=META_CODES[studio];
  if(!code)return[];
  return META_RAW.filter(r=>{
    if(!r.campaign_name.includes(code))return false;
    if(from&&r.date<from)return false;
    if(to&&r.date>to)return false;
    return true;
  });
}

function _metaCreativeName(adName){
  return (adName||'').replace(/^\d+\-[A-Z]{2}\-\d+\-\d+\s*-\s*/i,'').trim()||adName||'';

function drawMetaTrend(from,to,activeStudios){
  const ctx=document.getElementById('metaSpendChart');if(!ctx)return;
  if(_ch.meta){_ch.meta.destroy();_ch.meta=null;}
  const datasets=activeStudios.map(studio=>{
    const rows=metaFilter(studio,from,to);
    const byDate={};rows.forEach(r=>{byDate[r.date]=(byDate[r.date]||0)+(r.spend||0)});
    return{studio,byDate};
  });
  const allDates=[...new Set(datasets.flatMap(d=>Object.keys(d.byDate)))].sort();
  const isMob=window.innerWidth<=768;
  _ch.meta=new Chart(ctx,{type:'bar',data:{labels:allDates.map(d=>fmDay(d)),datasets:datasets.map(({studio,byDate})=>({label:studio.replace('SWEAT440 ',''),data:allDates.map(d=>+(byDate[d]||0).toFixed(2)),backgroundColor:studioColor(studio)+'cc',borderColor:studioColor(studio),borderWidth:1}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'Oswald',size:12,style:'italic'},usePointStyle:true,padding:14}},tooltip:{mode:'index',intersect:false,callbacks:{label:ctx=>`${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}`}}},scales:{x:{stacked:true,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10},color:'#5a7a8a',autoSkip:true,maxTicksLimit:isMob?5:14,maxRotation:0}},y:{stacked:true,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:11},color:'#5a7a8a',callback:v=>'$'+v}}}}});
}

function googleFilter(studio,from,to){
  if(!GOOGLE_RAW)return[];
  const acct=GOOGLE_ACCOUNTS[studio];
  if(!acct)return[];
  return GOOGLE_RAW.filter(r=>{
    if(r.account_name!==acct)return false;
    if(from&&r.date<from)return false;
    if(to&&r.date>to)return false;
    return true;
  });
}

}

function _ga4StudioRows(studio,from,to){
  if(!GA4_RAW)return[];
  const slugs=GA4_SLUGS[studio]||[];
  if(!slugs.length)return[];
  return GA4_RAW.filter(r=>{
    if(!r.landing_page)return false;
    const lp=r.landing_page.toLowerCase();
    if(!slugs.some(s=>lp.includes(s)))return false;
    if(from&&r.date<from)return false;
    if(to&&r.date>to)return false;
    return true;
  });
}

function _ga4Sum(rows){
  return{
    sessions: rows.reduce((s,r)=>s+(r.sessions||0),0),
    users:    rows.reduce((s,r)=>s+(r.total_users||0),0),
    newUsers: rows.reduce((s,r)=>s+(r.new_users||0),0),
  };
}

  const filtered=studios.map(s=>({
    ...s,
    current_followers:s.current_followers||0,
    daily:(s.daily||[]).filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)),
    posts:(s.posts||[]).filter(p=>(!from||p.date>=from)&&(!to||p.date<=to))
  }));

  const ppFiltered=ppFromStr?studios.map(s=>({
    ...s,
    daily:(s.daily||[]).filter(r=>r.date>=ppFromStr&&r.date<=ppToStr),
    posts:(s.posts||[]).filter(p=>p.date>=ppFromStr&&p.date<=ppToStr)
  })):[];

  function _enrichPosts(studioList){
    return studioList.flatMap(s=>{
      const reachByDate={};s.daily.forEach(r=>{reachByDate[r.date]=r.reach||0;});
      const postsPerDay={};s.posts.forEach(p=>{postsPerDay[p.date]=(postsPerDay[p.date]||0)+1;});
      return s.posts.map(p=>({...p,studio:s.studio,code:s.code,
        est_reach:postsPerDay[p.date]?Math.round((reachByDate[p.date]||0)/postsPerDay[p.date]):0}));
    });
  }
  function _median(arr){if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);}
  function _sumKey(studioList,key){let t=0;studioList.forEach(s=>s.daily.forEach(r=>{t+=r[key]||0;}));return t;}

  const allPosts=_enrichPosts(filtered);
  const ppAllPosts=_enrichPosts(ppFiltered);

  const totalReach=_sumKey(filtered,'reach');
  const ppTotalReach=_sumKey(ppFiltered,'reach');
  const days=new Set(filtered.flatMap(s=>s.daily.map(r=>r.date))).size||1;
  const ppDays=new Set(ppFiltered.flatMap(s=>s.daily.map(r=>r.date))).size||1;
  const avgReach=Math.round(totalReach/days);
  const ppAvgReach=Math.round(ppTotalReach/ppDays);
  const totalFollowers=filtered.reduce((a,s)=>a+(s.current_followers||0),0);
  const hasFollowers=filtered.some(s=>s.current_followers>0);
  const medianLikes=_median(allPosts.map(p=>p.likes||0));
  const medianReach=_median(allPosts.map(p=>p.est_reach||0));
  const ppMedianLikes=_median(ppAllPosts.map(p=>p.likes||0));
  const ppMedianReach=_median(ppAllPosts.map(p=>p.est_reach||0));

  function _igDelta(curr,pp){
    if(!ppFromStr)return'';
    if(ppOutOfRange)return'<div class="kpi-card-delta neu">&#9651; out of range</div>';
    if(!pp)return'';
    const d=(curr-pp)/pp*100;
    const cls=d>=0?'pos':'neg';const arrow=d>=0?'&#9650;':'&#9660;';
    return`<div class="kpi-card-delta ${cls}">${arrow} ${Math.abs(d).toFixed(1)}% prev period</div>`;
  }
  function _igKpi(label,value,delta){
    return`<div class="kpi-card"><div class="kpi-card-label">${label}</div><div class="kpi-card-val">${value}</div>${delta}</div>`;
  }

  let h='';
  h+=`<div class="kpi-grid">`;
  if(hasFollowers)h+=_igKpi('Total Followers',totalFollowers.toLocaleString(),'');
  h+=_igKpi('Total Reach',totalReach.toLocaleString(),_igDelta(totalReach,ppTotalReach));
  h+=_igKpi('Avg Daily Reach',avgReach.toLocaleString(),_igDelta(avgReach,ppAvgReach));
  h+=_igKpi('Median Reach / Post',medianReach.toLocaleString(),_igDelta(medianReach,ppMedianReach));
  h+=_igKpi('Median Likes',medianLikes.toLocaleString(),_igDelta(medianLikes,ppMedianLikes));
  h+=_igKpi('Posts in Period',allPosts.length.toString(),_igDelta(allPosts.length,ppAllPosts.length));
  h+=`</div>`;

  if(allPosts.length){
    h+=`<div class="chart-card">
      <div class="chart-card-title">Best Performing Posts</div>
      <div style="overflow-x:auto">
        <table class="data-table" id="ig-posts-table">
          <thead><tr>
            <th style="width:68px"></th>
            <th data-sort="date">Date</th>
            <th data-sort="caption">Post</th>
            <th data-sort="media_type">Type</th>
            <th class="num" data-sort="est_reach">Reach</th>
            <th class="num" data-sort="likes">Likes</th>
            <th class="num" data-sort="comments">Comments</th>
            <th class="num" data-sort="shares">Shares</th>
            <th class="num" data-sort="engagement_rate">ER%</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>`;
  }

  el.innerHTML=h;

  if(allPosts.length){
    sortableTable('ig-posts-table',allPosts,(p)=>{
      const isVid=p.media_type==='VIDEO'||p.media_type==='REELS';
      const vidBadge=isVid?'<div style="position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:3px;font-size:9px;padding:1px 4px">&#9654;</div>':'';
      const _igSrc=p.image_url?(p.image_url.startsWith('http')?p.image_url:p.image_url.replace(/^nso-dashboard\//,'')):''
      const imgInner=_igSrc
        ?`<img class="soc-thumb" src="${_igSrc}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="soc-thumb-ph" style="display:none">${isVid?'&#9654;':'&#128247;'}</div>`
        :`<div class="soc-thumb-ph">${isVid?'&#9654;':'&#128247;'}</div>`;
      const img=p.permalink
        ?`<a href="${p.permalink}" target="_blank" rel="noopener" style="position:relative;display:block;width:60px">${imgInner}${vidBadge}</a>`
        :`<div style="position:relative;display:block;width:60px">${imgInner}</div>`;
      const caption=p.permalink
        ?`<a href="${p.permalink}" target="_blank" rel="noopener" style="color:#1a4d6e;text-decoration:none">${(p.caption||'').slice(0,90)||'(no caption)'}</a>`
        :((p.caption||'').slice(0,90)||'(no caption)');
      const typeLabel=p.media_type==='CAROUSEL_ALBUM'?'CAROUSEL':(p.media_type||'—');
      const er=p.engagement_rate!=null?parseFloat(p.engagement_rate).toFixed(2)+'%':'—';
      return`<tr>
        <td>${img}</td>
        <td style="white-space:nowrap;color:#8aaabb;font-size:12px">${fmDay(p.date)}</td>
        <td style="font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${caption}</td>
        <td style="font-size:12px">${typeLabel}</td>
        <td class="num">${(p.est_reach||0).toLocaleString()}</td>
        <td class="num">${(p.likes||0).toLocaleString()}</td>
        <td class="num">${(p.comments||0).toLocaleString()}</td>
        <td class="num">${(p.shares||0).toLocaleString()}</td>
        <td class="num">${er}</td>
      </tr>`;
    });
  }
}

function _drawIgChart(filtered){
  const ctx=document.getElementById('igReachChart');if(!ctx)return;
  if(_ch.ig){_ch.ig.destroy();_ch.ig=null;}
  const allDates=[...new Set(filtered.flatMap(s=>s.daily.map(r=>r.date)))].sort();
  if(!allDates.length)return;
  const isMob=window.innerWidth<=768;
  _ch.ig=new Chart(ctx,{type:'bar',data:{
    labels:allDates.map(d=>fmDay(d)),
    datasets:filtered.map(s=>{
      const byDate={};s.daily.forEach(r=>{byDate[r.date]=r.reach||0});
      const color=studioColor(s.studio);
      return{label:s.studio,data:allDates.map(d=>byDate[d]||0),backgroundColor:color+'cc',borderColor:color,borderWidth:1};
    })
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'Oswald',size:12,style:'italic'},usePointStyle:true,padding:14}},tooltip:{mode:'index',intersect:false}},
    scales:{x:{stacked:true,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10},color:'#5a7a8a',autoSkip:true,maxTicksLimit:isMob?5:14,maxRotation:0}},
      y:{stacked:true,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:11},color:'#5a7a8a'}}}}});
}

/* ── LOAD ─────────────────────────────────────────────────────────────── */
async function init(){
  // Auth check — redirects to login.html if no valid session
  const _authUser = checkAuth();
  if (!_authUser) return;
  CUR_USER=_authUser;
  renderAuthNav(_authUser);
  const _allowedStudios = getAuthStudios(_authUser);
  if(!isAdminUser()){
    const _igTab=document.getElementById('navTabInstagram');
    if(_igTab)_igTab.remove();
  }

  // Load all data files
  const [dataRes,scRes,mktRes,dashRes,gadsRes,socialRes,salesRes,gbpRes,adMetaRes]=await Promise.allSettled([
    fetch('../data.json?_='+Date.now()).then(r=>r.ok?r.json():Promise.reject()),
    fetch('nso_scorecard_data.json?_='+Date.now()).then(r=>r.ok?r.json():Promise.reject()),
    fetch('marketing_data.json?_='+Date.now()).then(r=>r.ok?r.json():Promise.reject()),
    fetch('dashboard_data.json?_='+Date.now()).then(r=>r.ok?r.json():Promise.reject()),
    fetch('nso_google_ads.json?_='+Date.now()).then(r=>r.ok?r.json():Promise.reject()),
    fetch('social_insights.json?_='+Date.now()).then(r=>r.ok?r.json():Promise.reject()),
    fetch('nso_sales_data.json?_='+Date.now()).then(r=>r.ok?r.json():Promise.reject()),
    fetch('gbp_data.json?_='+Date.now()).then(r=>r.ok?r.json():Promise.reject()),
    fetch('nso_ad_meta.json?_='+Date.now()).then(r=>r.ok?r.json():Promise.reject())
  ]);

  if(dataRes.status==='fulfilled'){RAW=dataRes.value;if(!RAW.daily_detail)RAW.daily_detail=[];if(!RAW.monthly_detail)RAW.monthly_detail=[]
    // data.json stores studio names without "SWEAT440 " prefix — normalize to match NSO array
    const _nsoShort=['Dallas - Prestonwood','Herriman','Naples - Mercato','Pinecrest - Palmetto Bay','Reston','Dr Phillips','Orlando - Dr Phillips','Aventura','North Miami','Dallas - Uptown','Old Bridge','Dunwoody','Middletown'];
    function _normStudio(arr){return arr.map(r=>_nsoShort.includes(r.studio)?{...r,studio:'SWEAT440 '+r.studio}:r)}
    RAW.daily_detail=_normStudio(RAW.daily_detail);RAW.monthly_detail=_normStudio(RAW.monthly_detail);}
  else{console.error('data.json failed');RAW={daily_detail:[],monthly_detail:[],sources:[],studios:[]}}

  if(scRes.status==='fulfilled'){SC=scRes.value}
  else{console.warn('nso_scorecard_data.json not found');SC={studios:[]};document.getElementById('summaryContent').innerHTML='<div style="padding:40px;text-align:center;color:#8aaabb;font-family:Oswald,sans-serif;font-style:italic">Scorecard data not yet available for NSO studios.</div>'}

  if(mktRes.status==='fulfilled'){GA4_RAW=mktRes.value.ga4_traffic||[];META_RAW=mktRes.value.meta_ads||[]}
  else{console.warn('marketing_data.json not found');GA4_RAW=[];META_RAW=[]}

  if(dashRes.status==='fulfilled'){
    if(!META_RAW.length)META_RAW=dashRes.value.tabs?.meta_ads||[];
    if(!GA4_RAW.length)GA4_RAW=dashRes.value.tabs?.ga4_traffic||[];
  }else{console.warn('dashboard_data.json not found')}

  if(gadsRes.status==='fulfilled'){GOOGLE_RAW=gadsRes.value.google_ads||[]}
  else{console.warn('nso_google_ads.json not found');GOOGLE_RAW=[]}

  if(socialRes.status==='fulfilled'){SOCIAL_RAW=socialRes.value}
  else{console.warn('social_insights.json not found');SOCIAL_RAW={facebook:[],instagram:[]}}

  if(salesRes.status==='fulfilled'){
    NSO_SALES=salesRes.value;
    NSO_SALES_ROWS=[];
    Object.values(NSO_SALES.studios||{}).forEach(s=>{
      // Use "SWEAT440 {data_name}" when data_name differs (e.g. Dr Phillips → "SWEAT440 Orlando - Dr Phillips")
      // so fR exact-match filter AND _strip()-based Summary filter both work
      const _scStu=SC.studios?SC.studios.find(x=>x.code===s.code):null;
      const _stuKey=(_scStu&&_scStu.data_name)?'SWEAT440 '+_scStu.data_name:s.name;
      (s.daily||[]).forEach(r=>{
        NSO_SALES_ROWS.push({date:r.date,studio:_stuKey,source:r.source||'Unknown',first_sales:r.presales||0,cancellations:r.cancellations||0,gross_revenue:r.gross_revenue||0});
      });
    });
  }else{console.warn('nso_sales_data.json not found');NSO_SALES=null;NSO_SALES_ROWS=[]}

  if(gbpRes.status==='fulfilled'){GBP_RAW=gbpRes.value}
  else{console.warn('gbp_data.json not found');GBP_RAW=null}

  if(adMetaRes.status==='fulfilled'){AD_META=adMetaRes.value.ad_meta||{}}
  else{console.warn('nso_ad_meta.json not found — thumbnails may be stale')}

  // Build multi-selects (filter NSO list to allowed studios if franchisee)
  // NSO names have "SWEAT440 " prefix; users.js stores names without it (matching data.json)
  const _nsoVisible = _allowedStudios
    ? NSO.filter(s => _allowedStudios.includes(s.replace(/^SWEAT440\s+/, '')))
    : NSO;
  _buildMS('studioMenu','studioLabel',_nsoVisible,[]);
  // Canonical source list from MARKETING_REPORTS.PUBLIC.LEADS_LIST
  const _allSrc=['Meta Ads','Google Ads','Local Listings','Social Media Organic','Website (unattributed)','Word of Mouth','SWEAT440 App','MindBody App','ClassPass / Platforms','Grassroots','Business Mode','Print Ads / Signs','Internet / AI Search','Other','N/A'];
  _buildMS('sourceMenu','sourceLabel',_allSrc,EXCL_SRC);

  // Fallback dates
  const nsoRows=[...(RAW.daily_detail||[]),...(RAW.monthly_detail||[])].filter(r=>NSO.includes(r.studio));
  const allKeys=nsoRows.map(r=>r.date||r.month).filter(Boolean).sort();
  if(allKeys.length){const lk=allKeys[allKeys.length-1].slice(0,7);const df=document.getElementById('fFrom').value.slice(0,7);const has=allKeys.some(k=>k>=df+'-01'&&k<=df+'-31');if(!has){const ld=new Date(lk+'-01T00:00:00Z');document.getElementById('fFrom').value=new Date(Date.UTC(ld.getUTCFullYear(),ld.getUTCMonth(),1)).toISOString().slice(0,10);document.getElementById('fTo').value=new Date(Date.UTC(ld.getUTCFullYear(),ld.getUTCMonth()+1,0)).toISOString().slice(0,10)}}

  // Cap leads data to NSO_SALES end date (both use 2-day lag; data.json may lag behind)
  const _salesEnd=NSO_SALES&&NSO_SALES.date_range&&NSO_SALES.date_range.end||null;
  if(_salesEnd&&RAW.daily_detail){RAW.daily_detail=RAW.daily_detail.filter(r=>!r.date||r.date<=_salesEnd);}
  const _lastD=_salesEnd||(RAW.daily_detail||[]).map(r=>r.date).filter(Boolean).sort().pop();
  if(_lastD){const _ld=new Date(_lastD+'T00:00:00Z');_dataThruLabel='Data until '+(_ld.getUTCMonth()+1)+'/'+_ld.getUTCDate()+'/'+_ld.getUTCFullYear();}
  document.querySelectorAll('.data-thru-label').forEach(el=>el.textContent=_dataThruLabel);
  document.querySelector('.controls-bar').style.display='none';
  renderSummary();
  renderFunnel();
  applyFilters();
}
init();
</script>
